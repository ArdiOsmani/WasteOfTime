<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OOPS, I DIED!</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--paper:#f2efe6;--mut:#8a867b;--hot:#c8201a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#e9e5d9;--mut:#8f8b80}}
:root[data-theme="dark"]{--paper:#e9e5d9;--mut:#8f8b80}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:17px}
body{background-image:radial-gradient(circle,#2a2a2a 1px,transparent 1.5px);background-size:9px 9px}
#app{max-width:560px;margin:0 auto;padding:12px}
.A,h1,.big,.num{font-family:Anton,Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em}
h1{font-size:3.1rem;line-height:.95;margin:6px 0 2px;text-align:center;transform:rotate(-1.5deg)}
h1 span{background:var(--paper);color:var(--ink);padding:0 8px}
.tag{text-align:center;color:var(--mut);margin-bottom:10px}
.hud{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;border:3px solid var(--paper);padding:6px 10px;margin:8px 0;font-family:Anton,Impact,sans-serif;letter-spacing:.04em}
.hud b{font-size:1.4rem;color:var(--paper)}
.mat{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--ink);border:4px solid var(--paper);padding:6px;margin:10px 0}
.cell{background:var(--paper);color:var(--ink);padding:8px 10px;position:relative;cursor:pointer;user-select:none;min-height:84px;transform:rotate(var(--r,0deg))}
.cell::after{content:"";position:absolute;right:0;bottom:0;width:46px;height:36px;background:radial-gradient(circle,var(--ink) 1.3px,transparent 1.8px) 0 0/6px 6px;-webkit-mask:linear-gradient(135deg,transparent 40%,#000);mask:linear-gradient(135deg,transparent 40%,#000);opacity:.7}
.cell .big{font-size:1.5rem;line-height:1}
.cell .od{font-family:Anton,Impact,sans-serif;font-size:2.3rem;line-height:1;float:right}
.cell small{display:block;font-size:.88rem;line-height:1.05;margin-top:4px}
.w2{grid-column:span 2}
.place{background:var(--ink);color:var(--paper);border:0;display:flex;align-items:center;font-family:Anton,Impact,sans-serif;font-size:2rem;line-height:.95;cursor:default}
.place::after{display:none}
.chips{position:absolute;left:8px;bottom:6px;display:flex;gap:4px;align-items:center;z-index:2}
.coin{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:1rem Anton,Impact,sans-serif;border:2px solid var(--paper);outline:2px solid var(--ink)}
.chips button{background:var(--ink);color:var(--paper);border:0;width:24px;height:24px;border-radius:50%;font:1rem Anton,Impact,sans-serif;padding:0;cursor:pointer}
.fing{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;margin:10px 0}
.fing button{font:inherit;background:var(--ink);color:var(--paper);border:3px solid var(--paper);border-radius:30px 30px 10px 10px;padding:8px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.fing button:nth-child(1){margin-top:34px}.fing button:nth-child(2){margin-top:6px}.fing button:nth-child(3){margin-top:0}.fing button:nth-child(4){margin-top:10px}.fing button:nth-child(5){margin-top:30px}
.fing .num{background:var(--paper);color:var(--ink);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:1rem}
.fing .nm{font-family:Anton,Impact,sans-serif;font-size:.78rem;line-height:1;text-align:center;text-transform:uppercase}
.fing .st{font-size:.8rem;color:var(--mut)}
.fing button.own{background:var(--paper);color:var(--ink)}.fing button.own .num{background:var(--ink);color:var(--paper)}.fing button.own .st{color:var(--ink)}
.fing button.dead{border-style:dashed;opacity:.35;cursor:default}
.fing button.pick{animation:pk .7s infinite alternate;border-color:var(--hot)}
@keyframes pk{to{transform:translateY(-6px)}}
.fing svg{width:26px;height:44px}
.dice{display:flex;justify-content:center;gap:18px;align-items:center;margin:10px 0;min-height:90px}
.dice svg{width:84px;height:84px}.dice.go svg{animation:sh .4s}
@keyframes sh{0%{transform:rotate(-30deg) translateY(-10px)}60%{transform:rotate(18deg)}100%{transform:none}}
.puck{width:64px;height:64px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;text-align:center;font:1.5rem/1 Anton,Impact,sans-serif;border:4px solid var(--ink);outline:3px solid var(--paper)}
.puck small{display:block;font-size:.55rem}
.say{border:3px solid var(--paper);padding:8px 12px;margin:10px 0;min-height:2.4em;transform:rotate(.4deg)}
.say b{font-family:Anton,Impact,sans-serif;font-weight:400}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
button.b{font:1.35rem Anton,Impact,sans-serif;text-transform:uppercase;background:var(--paper);color:var(--ink);border:0;padding:8px 18px;cursor:pointer;transform:rotate(-1deg)}
button.b.alt{background:transparent;color:var(--paper);border:3px solid var(--paper)}
button.b:disabled{opacity:.35;cursor:default}
.leg{font-size:.88rem;color:var(--mut);line-height:1.15}
.leg b{color:var(--paper);font-family:Anton,Impact,sans-serif;font-weight:400}
.over{text-align:center;border:4px solid var(--paper);padding:14px;margin:12px 0}
.over .big{font-size:2.4rem} #app{position:relative} .tray{background:radial-gradient(circle,#1c1c1c 1px,transparent 1.5px) 0 0/8px 8px,#050505;border:4px solid var(--paper);box-shadow:inset 0 0 0 4px var(--ink),inset 0 0 0 6px var(--mut);padding:18px 8px 12px;margin:16px 0 10px;position:relative} .tray .lab{position:absolute;top:-14px;left:12px;background:var(--ink);padding:0 8px;font-family:Anton,Impact,sans-serif;letter-spacing:.06em} .tray .dice{margin:0} .dice.tum svg{filter:drop-shadow(4px 6px 0 #000)} .hint{text-align:center;padding:6px 10px;margin:8px 0;border:2px dashed var(--mut)} .res{text-align:center;font:1.6rem/1.1 Anton,Impact,sans-serif;text-transform:uppercase;padding:8px;margin:8px 0;animation:st .35s cubic-bezier(.2,1.6,.4,1)} .res small{display:block;font:.95rem 'Patrick Hand',cursive;text-transform:none;letter-spacing:0} .res.good{background:var(--paper);color:var(--ink)} .res.bad{background:var(--hot);color:#fff} .res.neu{border:3px solid var(--paper)} .stamp{text-align:center;margin:14px 0;animation:st .5s cubic-bezier(.2,1.6,.4,1)} .stamp .big{font-size:3.4rem;line-height:1;display:inline-block;padding:2px 16px;border:6px solid;transform:rotate(-6deg)} .stamp.good .big{color:var(--paper)} .stamp.bad .big{color:var(--hot)} @keyframes st{from{transform:scale(2.6);opacity:0}to{transform:none;opacity:1}} .rows{margin:8px 0;border:3px solid var(--paper)} .rows div{display:flex;justify-content:space-between;padding:4px 10px;border-top:1px solid var(--mut)} .rows div:first-child{border-top:0} .rows .w{background:var(--paper);color:var(--ink)} .rows .l{color:var(--mut);text-decoration:line-through} .safe{position:absolute;left:8px;top:-10px;background:var(--ink);color:var(--paper);font:.75rem Anton,Impact,sans-serif;padding:1px 6px;text-transform:uppercase;z-index:2} body.shake #app{animation:shk .45s} @keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}} .help{position:absolute;right:8px;top:8px;font-size:1rem!important;padding:4px 10px!important} .tut{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))} .tc{max-width:480px;width:100%;max-height:100%;overflow:auto;border:4px solid var(--paper);padding:16px;background:var(--ink)} .tc h2{font:2rem/1 Anton,Impact,sans-serif;text-transform:uppercase;margin:0 0 8px} .tc p{margin:8px 0;line-height:1.25} .tc .ex{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0;flex-wrap:wrap} .tc .ex svg{width:50px;height:50px} .tc .ex b{font:1.5rem Anton,Impact,sans-serif} .tc .win{background:var(--paper);color:var(--ink);padding:2px 8px} .tc .lose{background:var(--hot);color:#fff;padding:2px 8px} .dots{text-align:center;margin:10px 0;letter-spacing:6px}
</style></head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),rd=()=>1+Math.floor(Math.random()*6),sum=d=>d[0]+d[1];
const FING=[{k:'thumb',n:'Thumbs Up',c:2,d:'Reroll both dice once.'},{k:'index',n:'Point Taken',c:3,d:'Reroll one die once.'},{k:'bird',n:'The Bird',c:1,d:'A losing Come-Out roll sets a Point instead.'},{k:'ring',n:'Ring-a-Ding',c:4,d:'Double the profit of one winning bet.'},{k:'pinky',n:'Pinky Promise',c:1,d:'If craps wins, repay 1× instead of 2×. If craps loses, lose a finger.'}];
const BETS=[{k:'pass',n:'Pass Line',o:1,d:'Win the craps round',c:'w2',r:-.6},{k:'hunt',n:'Point Hunter',o:2,d:'Win by hitting the Point',r:.7},{k:'seven',n:'Lucky Seven',o:4,d:'Roll 7 on the Come-Out',r:-.8},{k:'eleven',n:'Eleven Heaven',o:15,d:'Roll 11 on the Come-Out',c:'w2',r:.4},{k:'snake',n:'Snake Eyes',o:30,d:'Roll double ones on the Come-Out',r:-.5}];
const RANKS=[[15,'Undying'],[12,'Death’s Headache'],[9,'Grave Dodger'],[6,'Dead Meat'],[1,'Worm Food']];
const BONE='<svg viewBox="0 0 26 44"><g fill="currentColor"><circle cx="8" cy="7" r="5"/><circle cx="18" cy="7" r="5"/><rect x="10.5" y="8" width="5" height="28"/><circle cx="8" cy="37" r="5"/><circle cx="18" cy="37" r="5"/></g></svg>';
let S,best=0,seen=0;
function init(){S={tut:seen?-1:0,rows:'',round:1,coins:1,bets:{pass:0,hunt:0,seven:0,eleven:0,snake:0},alive:{thumb:1,index:1,bird:1,ring:1,pinky:1},own:{},phase:'bet',stage:'come',point:null,dice:[0,0],comeDice:null,loss:0,go:0,wins:[],win:false,hit:false,recap:'',msg:'Oops. You died. That’s not good… Place your bets, friend.'};}
const tot=()=>Object.values(S.bets).reduce((a,b)=>a+b,0),free=()=>S.coins-tot();
function die(v,r){const P={0:[],1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[3,1],[1,3],[3,3]],5:[[1,1],[3,1],[2,2],[1,3],[3,3]],6:[[1,1],[3,1],[1,2],[3,2],[1,3],[3,3]]}[v];
return `<svg viewBox="0 0 80 80"${r!=null?` style="transform:rotate(${r}deg) translateY(${Math.abs(r%9)}px)"`:''}><rect x="4" y="4" width="72" height="72" rx="13" fill="#0a0a0a" stroke="#f2efe6" stroke-width="4"/>${v?'':'<text x="40" y="54" text-anchor="middle" font-family="Anton,Impact" font-size="40" fill="#f2efe6">?</text>'}${P.map(([x,y])=>`<circle cx="${x*20}" cy="${y*20}" r="${v===1?9:6.5}" fill="#f2efe6"/>`).join('')}</svg>`;}
function bet(k,n){if(S.phase!=='bet')return;if(n>0&&free()<1)return;if(n<0&&S.bets[k]<1)return;S.bets[k]+=n;render();}
function buy(k){const f=FING.find(x=>x.k===k);if(S.phase==='lose'){if(!S.alive[k])return;S.alive[k]=0;S.own[k]=0;S.loss--;S.recap+=` You give up your ${f.n.toLowerCase()} finger.`;if(!Object.values(S.alive).some(x=>x)){S.phase='over';best=Math.max(best,S.round);}else if(S.loss<=0)next();render();return;}
if(S.phase!=='bet'||!S.alive[k]||S.own[k]||free()<f.c)return;S.coins-=f.c;S.own[k]=1;render();}
function tumble(keep,nd){S.phase='rolling';S.msg='Rolling… come on, come on…';render();let n=0;const iv=setInterval(()=>{n++;const e=$('#dice');if(e)e.innerHTML=[0,1].map(i=>i===keep?die(S.dice[i],0):die(rd(),Math.floor(Math.random()*90-45))).join('')+pk();if(n>=11){clearInterval(iv);S.dice=nd;S.go=1;S.phase='review';S.msg=S.stage==='come'?'Come-out roll. Reroll, or lock it in.':`Point is ${S.point}. Reroll, or lock it in.`;render();}},90);}
function roll(){tumble(-1,[rd(),rd()]);}
function pk(){return S.point?`<div class='puck'><div>${S.point}<small>POINT</small></div></div>`:'';}
function re(i){let nd;if(i===2){if(!S.own.thumb)return;S.own.thumb=0;nd=[rd(),rd()];}else{if(!S.own.index)return;S.own.index=0;nd=[...S.dice];nd[i]=rd();}tumble(i===2?-1:1-i,nd);}
function bird(){S.comeDice=[...S.dice];S.point=sum(S.dice);S.own.bird=0;S.stage='point';S.phase='roll';S.msg=`The Bird! ${S.point} is your Point instead. Death is… amused.`;render();}
function cont(){const t=sum(S.dice);
if(S.stage==='come'){S.comeDice=[...S.dice];if(t===7||t===11)return fin(1,0,`A natural ${t}!`);if([2,3,12].includes(t))return fin(0,0,`Craps. ${t}. Ouch.`);S.point=t;S.stage='point';S.phase='roll';S.msg=`Point is ${t}. Roll it again before a 7.`;}
else{if(t===S.point)return fin(1,1,`You hit the Point (${t})!`);if(t===7)return fin(0,0,'Seven out. Death smiles.');S.phase='roll';S.msg=`${t}. Nothing happens. Roll again.`;}render();}
function fin(win,hit,m){S.win=win;S.hit=hit;S.msg=m;const c=sum(S.comeDice),b=S.bets,w=[];
if(b.pass&&win)w.push('pass');if(b.hunt&&hit)w.push('hunt');if(b.seven&&c===7)w.push('seven');if(b.eleven&&c===11)w.push('eleven');if(b.snake&&S.comeDice[0]===1&&S.comeDice[1]===1)w.push('snake');
S.wins=w;if(S.own.ring&&w.length){S.phase='ring';render();}else settle(null);}
function settle(rk){let pay=0,lines=[];for(const k of S.wins){const B=BETS.find(x=>x.k===k),pr=S.bets[k]*B.o*(rk===k?2:1);pay+=S.bets[k]+pr;lines.push(`${B.n} +${pr}`);}
if(rk)S.own.ring=0;S.coins=S.coins-tot()+pay;
let rep=2*S.round;if(S.own.pinky){S.own.pinky=0;if(S.win)rep=S.round;else S.loss++;}
if(S.coins>=rep){S.coins-=rep;}else{S.coins=0;S.loss++;}
S.rows=BETS.filter(B=>S.bets[B.k]).map(B=>{const w=S.wins.includes(B.k),pr=S.bets[B.k]*B.o*(rk===B.k?2:1);return `<div class='${w?'w':'l'}'><span>${B.n} (${S.bets[B.k]})</span><span>${w?'WON +'+pr:'LOST −'+S.bets[B.k]}</span></div>`}).join('');S.recap=`<b>${S.msg}</b> Death collects <b>${rep}</b>.${S.loss?' <b>You couldn’t cover it. *snip*</b>':' You can pay!'} You have <b>${S.coins}</b> left.`;if(!S.win){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),500);}S.phase='recap';render();}
function after(){if(S.loss>0){S.phase='lose';S.msg='Choose a finger to sacrifice. Its powerup goes with it.';render();}else next();}
function next(){S.round++;S.coins+=S.round;S.bets={pass:0,hunt:0,seven:0,eleven:0,snake:0};S.point=null;S.stage='come';S.dice=[0,0];S.comeDice=null;S.phase='bet';S.msg=`Round ${S.round}. Death loans you ${S.round} coin${S.round>1?'s':''}. Spend them all.`;}
function render(){let h=`<button class='b alt help' onclick='S.tut=0;render()'>? How to play</button><h1>OOPS, <span>I DIED!</span></h1><div class="tag">a solo craps roguelike about gambling with Death</div>`;
if(S.phase==='over'){const rk=RANKS.find(r=>S.round>=r[0])[1];h+=`<div class="over"><div class="big">You are dead (again)</div><p>You reached round <b class="A">${S.round}</b><br>Rank: <b class="A">${rk}</b><br>Best this session: ${best}</p><p><i>Death thanks you for your patronage. He’d shake your hand, but… well.</i></p><button class="b" onclick="init();render()">Die again</button></div>`+fingers();$('#app').innerHTML=h;return;}
h+=`<div class="hud"><span>Round <b>${S.round}</b></span><span>Coins <b>${S.coins}</b></span><span>Free <b>${free()}</b></span><span>Repay <b>${S.own.pinky?'1–2×':'2×'} (${2*S.round})</b></span></div>`;
h+=`<div class="say"><b>DEATH:</b> ${S.phase==='recap'?S.recap:S.msg}</div>`;
h+=`<div class='tray'><span class='lab'>ROLL ZONE</span><div id='dice' class='dice ${S.go?'go':''} ${S.phase==='rolling'?'tum':''}'>${die(S.dice[0])}${die(S.dice[1])}${pk()}</div></div>`;S.go=0;if(S.phase==='bet')h+=`<div class='hint'>👉 Tap a bet spot below to put a coin on it. <b>${free()}</b> coin${free()===1?'':'s'} left to place.${free()?'':' All placed — hit ROLL!'}${S.round===1?' <b>First time? Tap PASS LINE.</b>':''}</div>`;if(S.phase==='review'){const x=explain(sum(S.dice));h+=`<div class='res ${x[0]}'>${x[1]}<small>${x[2]}</small></div>`;}if(S.phase==='roll')h+=`<div class='hint'>Point is <b>${S.point}</b>. Roll a <b>${S.point}</b> to win — a <b>7</b> loses. Anything else: roll again.</div>`;if(S.phase==='ring'||S.phase==='recap')h+=`<div class='stamp ${S.win?'good':'bad'}'><span class='big'>${S.win?'You win!':'You lose!'}</span></div>`;if(S.phase==='recap')h+=`<div class='rows'>${S.rows||'<div><span>No bets placed</span></div>'}</div>`;
h+=`<div class="mat">`+BETS.map(B=>{const n=S.bets[B.k],pre=B.k==='snake'?`<div class="cell place">Place your bets</div>`:'';
return pre+`<div class="cell ${B.c||''}" style="--r:${B.r}deg" onclick="bet('${B.k}',1)">${B.k==='pass'?'<span class="safe">★ safest bet</span>':''}<span class="od">${B.o}:1</span><span class="big">${B.n}</span><small>${B.d}</small>${n?`<span class="chips"><span class="coin">${n}</span>${S.phase==='bet'?`<button onclick="event.stopPropagation();bet('${B.k}',-1)">−</button>`:''}</span>`:''}</div>`;}).join('')+`</div>`;
h+=fingers()+`<div class="acts">`;
const t=sum(S.dice);
if(S.phase==='bet')h+=`<button class="b" ${free()?'disabled':''} onclick="roll()">${free()?`Spend ${free()} more`:'Roll the bones'}</button>`;
if(S.phase==='roll')h+=`<button class="b" onclick="roll()">Roll</button>`;
if(S.phase==='review'){if(S.own.thumb)h+=`<button class="b alt" onclick="re(2)">Reroll both</button>`;if(S.own.index)h+=`<button class="b alt" onclick="re(0)">Reroll die 1</button><button class="b alt" onclick="re(1)">Reroll die 2</button>`;if(S.own.bird&&S.stage==='come'&&[2,3,12].includes(t))h+=`<button class="b alt" onclick="bird()">The Bird</button>`;h+=`<button class="b" onclick="cont()">Lock it in</button>`;}
if(S.phase==='ring'){h+=`<div class="say" style="width:100%"><b>RING-A-DING:</b> double the profit of which winning bet?</div>`+S.wins.map(k=>`<button class="b alt" onclick="settle('${k}')">${BETS.find(x=>x.k===k).n}</button>`).join('')+`<button class="b" onclick="settle(null)">Skip</button>`;}
if(S.phase==='recap')h+=`<button class="b" onclick="after()">Continue</button>`;
h+=`</div><div class="leg">${FING.map(f=>`<b>${f.n} (${f.c})</b> ${f.d}`).join('<br>')}<br><br>Spend or wager <b>ALL</b> your coins each round. Buy powerups after betting, before rolling. Winning bets return the wager plus profit.</div>`;
$('#app').innerHTML=h;}
function fingers(){return `<div class="fing">`+FING.map(f=>{const dead=!S.alive[f.k],own=S.own[f.k],pick=S.phase==='lose'&&!dead,can=S.phase==='bet'&&!dead&&!own&&free()>=f.c;
return `<button class="${dead?'dead':''} ${own?'own':''} ${pick?'pick':''}" onclick="buy('${f.k}')" title="${f.d}"><span class="num">${f.c}</span>${BONE}<span class="nm">${f.n}</span><span class="st">${dead?'CUT OFF':own?'READY':can?'BUY':pick?'SNIP?':'—'}</span></button>`;}).join('')+`</div>`;}
function explain(t){if(S.stage==='come'){if(t===7||t===11)return['good',`${t}! A natural!`,'7 or 11 on the first roll = you win the round.'];if([2,3,12].includes(t))return['bad',`${t}… craps!`,'2, 3 or 12 on the first roll = you lose the round.'+(S.own.bird?' You own The Bird — use it!':'')];return['neu',`${t} becomes the POINT`,`Next you keep rolling. Roll a ${t} again to win, but a 7 loses.`];}if(t===S.point)return['good',`${t}! You hit the Point!`,'You win the round.'];if(t===7)return['bad','7… seven out!','Rolling a 7 before your Point loses the round.'];return['neu',`${t}. Nothing happens.`,`Not your Point (${S.point}) and not a 7. Roll again.`];}
const TUT=[['You’re dead. Oops.',`<p>Death will let you live a bit longer if you beat him at dice. The catch: <b>every time you can’t pay him, he takes a finger.</b></p><p>You have <b>5 fingers</b>. Lose them all and the game is over. Your score is how many <b>rounds</b> you survive.</p>`],['Coins and the debt',`<p>Each round Death <b>lends you coins</b> equal to the round number. Round 1 = 1 coin. Round 4 = 4 coins.</p><p>At the end he wants <b>double</b> back (round 4 = pay 8). So you have to <b>win extra coins</b> by gambling.</p>`],['Two dice, add them',`<p>You roll two dice and add them together. That is your total.</p><div class='ex'>${die(3)}<b>+</b>${die(4)}<b>=</b><b>7</b></div>`],['Step 1: the first roll',`<p>The first roll of every round is called the come-out:</p><div class='ex'><b class='win'>7 or 11 = YOU WIN</b></div><div class='ex'><b class='lose'>2, 3 or 12 = YOU LOSE</b></div><p>Any other total (4, 5, 6, 8, 9, 10) becomes your <b>POINT</b>. Remember that number.</p>`],['Step 2: chase the Point',`<p>Now keep rolling until one of these happens:</p><div class='ex'><b class='win'>Roll your Point again = WIN</b></div><div class='ex'><b class='lose'>Roll a 7 = LOSE</b></div><p>Anything else does nothing, just roll again. Example: your Point is 6. You roll 9, then 4, then 6. You win!</p>`],['Betting',`<p>Before rolling, tap the spots on the mat to put coins down. <b>You must use ALL your coins</b> (bets or powerups) before you can roll.</p><p><b>Pass Line</b> bets that you win the round. It pays 1:1 (bet 1, win 1 extra). It’s the safe one.</p><p>The rest are long shots: <b>Lucky Seven</b> (first roll is 7) pays 4:1, <b>Eleven Heaven</b> (first roll is 11) pays 15:1, <b>Snake Eyes</b> (first roll is 1+1) pays 30:1. <b>Point Hunter</b> (you win by hitting the Point) pays 2:1.</p>`],['Fingers are powerups',`<p>Before rolling you can tap a finger to <b>buy a powerup</b>. Use them after a roll, before you lock it in:</p><p>👍 <b>Thumbs Up</b> (2): reroll both dice<br>☝️ <b>Point Taken</b> (3): reroll one die<br>🖕 <b>The Bird</b> (1): a losing first roll becomes a Point instead<br>💍 <b>Ring-a-Ding</b> (4): double the profit of one winning bet<br>🤙 <b>Pinky Promise</b> (1): repay only 1× if you win, but lose a finger if you lose</p><p>Coins spent on powerups can’t be bet, so don’t overspend early.</p>`],['Paying Death',`<p>After the round, Death takes double the round number. If you can’t pay, he takes <b>all your coins and one finger</b>. You pick which one, and its powerup is gone for good.</p><p>Leftover coins carry over, but you must spend them all next round too.</p>`],['Quick tips',`<p>✔ Round 1: put your 1 coin on <b>PASS LINE</b> and roll.<br>✔ Long shots are fun but rarely hit.<br>✔ Reroll bad results <b>before</b> you tap “Lock it in”.<br>✔ Losing a finger isn’t the end. Losing all five is.</p><p>Ready? Go gamble with Death.</p>`]];
function tutHTML(){const i=S.tut,t=TUT[i];return `<div class='tut'><div class='tc'><h2>${t[0]}</h2>${t[1]}<div class='dots'>${TUT.map((_,j)=>j===i?'●':'○').join('')}</div><div class='acts'>${i?`<button class='b alt' onclick='S.tut--;render()'>Back</button>`:''}${i<TUT.length-1?`<button class='b' onclick='S.tut++;render()'>Next</button>`:`<button class='b' onclick='S.tut=-1;seen=1;render()'>Let’s play</button>`}<button class='b alt' onclick='S.tut=-1;seen=1;render()'>Skip</button></div></div></div>`;}
let _r=render;render=function(){_r();if(S.tut>=0)$('#app').insertAdjacentHTML('beforeend',tutHTML());};
init();render();
</script></body></html>
